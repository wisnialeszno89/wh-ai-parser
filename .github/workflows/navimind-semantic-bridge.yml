name: NaviMind Semantic Bridge

on:
  push:
    branches:
      - feature/navimind-semantic-bridge
  pull_request:
    branches:
      - main

jobs:
  bridge-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run agent bridge tests
        run: python -m pytest tests/test_navimind_bridge.py
