name: NaviMind V2 Bridge Tests

on:
  pull_request:
    branches:
      - architecture/navimind-world-model-v2

jobs:
  bridge-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bridge test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv

      - name: Run V1 and V2 bridge contract tests
        run: |
          pytest -q \
            tests/test_knowledge_context.py \
            tests/test_navimind_task_reasoner.py \
            tests/test_navimind_task_reasoner_v2.py
