name: NaviMind Workspace Integration

on:
  pull_request:
    paths:
      - 'app/agent/runtime/navimind_*.py'
      - 'app/agent/intake/german_offer_mail.py'
      - 'tools/navimind_main_workspace.py'
      - 'tools/run_navimind_shared_control_center.py'
      - 'tools/run_navimind_control_panel.py'
      - 'tests/test_navimind_unified_document_engine.py'
      - 'tests/test_navimind_main_workspace_intake.py'
      - 'tests/test_navimind_live_conversation.py'
      - 'tests/test_navimind_ai_tool_selection.py'
      - '.github/workflows/navimind-workspace-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workspace-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded test requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify AI tool routing and local PDF consent
        shell: pwsh
        run: |
          python -m pytest -q tests/test_navimind_unified_document_engine.py tests/test_navimind_main_workspace_intake.py tests/test_navimind_live_conversation.py tests/test_navimind_ai_tool_selection.py tests/test_navimind_background_windowhub_reader.py tests/test_navimind_windowhub_one_shot_inspect.py
