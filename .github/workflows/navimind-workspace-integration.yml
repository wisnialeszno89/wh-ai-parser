name: NaviMind Workspace Integration

on:
  pull_request:
    paths:
      - 'app/agent/runtime/navimind_*.py'
      - 'app/agent/intake/german_offer_mail.py'
      - 'tools/navimind_main_workspace.py'
      - 'tools/run_navimind_shared_control_center.py'
      - 'tools/run_navimind_control_panel.py'
      - 'tests/test_navimind_unified_document_engine.py'
      - 'tests/test_navimind_main_workspace_intake.py'
      - 'tests/test_navimind_live_conversation.py'
      - 'tests/test_navimind_ai_tool_selection.py'
      - 'tests/test_navimind_draft_spec_guard.py'
      - 'app/agent/runtime/navimind_draft_spec_guard.py'
      - 'tests/test_navimind_offer_preflight.py'
      - 'tools/run_navimind_offer_preflight.py'
      - 'tools/inspect_navimind_catalogues_live.py'
      - 'tests/test_navimind_catalogue_background_probe.py'
      - 'app/agent/runtime/navimind_catalogue_background_probe.py'
      - 'tests/test_navimind_catalogue_readiness.py'
      - 'app/agent/runtime/navimind_catalogue_readiness.py'
      - 'tests/test_navimind_catalog_audit.py'
      - 'app/agent/runtime/navimind_catalog_audit.py'
      - 'tools/inspect_navimind_catalog_readiness.py'
      - 'tests/test_navimind_position_click_policy.py'
      - 'app/agent/runtime/navimind_position_click_policy.py'
      - 'tests/test_navimind_field_readback.py'
      - 'app/agent/runtime/navimind_field_readback.py'
      - 'tests/test_navimind_position_ledger.py'
      - 'app/agent/runtime/navimind_position_ledger.py'
      - 'tests/test_navimind_draft_bootstrap.py'
      - 'app/agent/runtime/navimind_draft_bootstrap.py'
      - 'tests/test_navimind_work_mission.py'
      - 'tests/test_navimind_local_teaching_session.py'
      - 'app/agent/runtime/navimind_local_teaching_session.py'
      - 'tests/test_navimind_shared_control_host.py'
      - '.github/workflows/navimind-workspace-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workspace-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded test requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify AI tool routing and local PDF consent
        shell: pwsh
        run: |
          python -m pytest -q tests/test_navimind_unified_document_engine.py tests/test_navimind_main_workspace_intake.py tests/test_navimind_live_conversation.py tests/test_navimind_ai_tool_selection.py tests/test_navimind_background_windowhub_reader.py tests/test_navimind_windowhub_one_shot_inspect.py tests/test_navimind_offer_preflight.py tests/test_navimind_catalogue_background_probe.py tests/test_navimind_catalogue_readiness.py tests/test_navimind_catalog_audit.py tests/test_navimind_position_click_policy.py tests/test_navimind_field_readback.py tests/test_navimind_position_ledger.py tests/test_navimind_draft_spec_guard.py tests/test_navimind_draft_bootstrap.py tests/test_navimind_work_mission.py tests/test_navimind_shared_control_host.py tests/test_navimind_local_teaching_session.py tests/test_navimind_panel_controller.py
