name: Visual Agent Pilot
on:
  pull_request:
    paths:
      - 'app/agent/visual/**'
      - 'tools/run_visual_agent.py'
      - 'tools/visual_agent_lab.py'
      - 'tests/test_visual_agent_runtime.py'
      - 'tests/test_visual_http_integration.py'
      - '.github/workflows/visual-agent-pilot.yml'
jobs:
  visual-contracts:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated visual-test dependencies
        run: python -m pip install pytest pillow python-dotenv
      - name: Test screenshot protocol and runtime without live desktop or API
        run: python -m pytest tests/test_visual_agent_runtime.py tests/test_visual_http_integration.py -q
      - name: Compile visual pilot
        run: python -m compileall -q app/agent/visual tools/run_visual_agent.py tools/visual_agent_lab.py
