name: WH Agent Contract Tests

on:
  pull_request:
  push:
    branches:
      - architecture/navimind-world-model-v2

jobs:
  targeted-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run knowledge and NaviMind bridge tests
        run: |
          pytest -q \
            tests/test_knowledge_context.py \
            tests/test_navimind_task_reasoner.py \
            tests/test_navimind_task_reasoner_v2.py \
            tests/test_agent_task_contract_v2.py \
            tests/test_agent_task_v2_world_builder.py \
            tests/test_autonomous_agent_runtime.py \
            tests/test_windowhub_environment_adapter.py \
            tests/test_windowhub_lookup_grid_adapter.py \
            tests/test_windowhub_ui_automation_provider.py \
            tests/test_windowhub_v2_observation_session.py \
            tests/test_windowhub_tab_selection.py \
            tests/test_active_document_context.py \
            tests/test_smoke_windowhub_new_offer_form.py \
            tests/test_windowhub_offer_form_action.py \
            tests/test_robot_gui_executor_uia.py \
            tests/test_windowhub_wizard_navigation.py \
            tests/test_live_windowhub_quantity_action_cli.py \
            tests/test_live_windowhub_next_step_cli.py
