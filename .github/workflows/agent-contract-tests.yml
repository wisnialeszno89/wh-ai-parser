name: WH Agent Contract Tests

on:
  pull_request:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv

      - name: Run knowledge and NaviMind bridge tests
        run: |
          pytest -q tests/test_knowledge_context.py tests/test_navimind_task_reasoner.py tests/test_autonomous_agent_runtime.py
