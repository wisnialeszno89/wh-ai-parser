name: WH Agent Contract Tests

on:
  pull_request:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv python-docx openpyxl playwright "pypdf>=5.0.0" numpy opencv-python-headless

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run agent contract, browser safety, and learned-skill tests
        run: |
          pytest -q \
            tests/test_knowledge_context.py \
            tests/test_navimind_task_reasoner.py \
            tests/test_reasoning_task_planner.py \
            tests/test_autonomous_agent_runtime.py \
            tests/test_windowhub_ui_automation_provider.py \
            tests/test_windowhub_win32_form_provider.py \
            tests/runtime/test_screen_element_fusion.py \
            tests/runtime/test_target_resolver.py \
            tests/test_target_resolver_document_scope.py \
            tests/test_windowhub_form_reader.py \
            tests/test_windowhub_grid_reader.py \
            tests/test_windowhub_ocr_provider.py \
            tests/test_windowhub_ocr_table_parser.py \
            tests/test_windowhub_ocr_table_refiner.py \
            tests/test_windowhub_ocr_table_lp_refiner.py \
            tests/test_windowhub_ocr_table_pipeline.py \
            tests/test_windowhub_ocr_table_multioffer_regression.py \
            tests/test_windowhub_ocr_table_runtime_integration.py \
            tests/test_windowhub_ocr_table_task_context.py \
            tests/test_windowhub_ocr_table_diagnostic.py \
            tests/test_reasoning_plan_replanner.py \
            tests/test_windowhub_environment_adapter_focus.py \
            tests/test_windowhub_tab_selection.py \
            tests/test_active_document_context.py \
            tests/test_workflow_repository.py \
            tests/test_learned_workflow_repository.py \
            tests/test_workflow_matcher.py \
            tests/test_semantic_transition.py \
            tests/test_learned_workflow_replayer.py \
            tests/test_learned_workflow_service.py \
            tests/test_learned_workflow_runtime.py \
            tests/test_semantic_text_input_observer.py \
            tests/test_human_action_interpreter_text_input.py \
            tests/test_learned_parameter.py \
            tests/test_learned_workflow_parameter_replay.py \
            tests/test_learned_workflow_service_parameters.py \
            tests/test_offer_request_parameter_resolver.py \
            tests/test_durable_agent_experience_memory.py \
            tests/test_learned_runtime_memory_recording.py \
            tests/test_adapter_registry.py \
            tests/test_filesystem_adapter.py \
            tests/test_pdf_document_adapter.py \
            tests/test_live_pdf_quote_draft_smoke.py \
            tests/test_legacy_pdf_cli.py \
            tests/test_quote_facts.py \
            tests/test_quote_fact_runtime_gate.py \
            tests/test_default_adapters.py \
            tests/test_word_document_adapter.py \
            tests/test_excel_workbook_adapter.py \
            tests/test_excel_annual_xy_aggregation.py \
            tests/test_email_draft_adapter.py \
            tests/test_default_executors.py \
            tests/test_browser_action_executor.py \
            tests/test_browser_action_risk_policy.py \
            tests/test_browser_agent_runtime.py \
            tests/test_browser_confirmation.py \
            tests/test_browser_confirmation_expiry.py \
            tests/test_browser_confirmation_freshness.py \
            tests/test_browser_confirmation_handshake.py \
            tests/test_browser_confirmation_live.py \
            tests/test_browser_confirmation_scope.py \
            tests/test_browser_confirmation_scope_execution.py \
            tests/test_browser_confirmation_task_boundary.py \
            tests/test_browser_local_risk_confirmation_e2e.py \
            tests/test_browser_local_risk_integration.py \
            tests/test_browser_negative_safety.py \
            tests/test_browser_adapter.py \
            tests/test_browser_verification.py \
            tests/test_playwright_browser_provider.py \
            tests/test_browser_navimind_bridge.py \
            tests/test_task_planning_context_adapters.py \
            tests/test_hough_line_normalizer.py \
            tests/test_windowhub_field_scope_diagnostics.py \
            tests/test_diagnose_windowhub_semantics.py \
            tests/test_windows_desktop_agent_runtime.py

      - name: Run resumable WindowHub task and checkpoint tests
        run: |
          pytest -q \
            tests/test_resumable_task.py \
            tests/test_resumable_task_repository.py \
            tests/test_resumable_task_service.py \
            tests/test_agent_runtime_resumable_task.py \
            tests/test_windowhub_agent_runtime.py

      - name: Run WindowHub resumable task adapter tests
        run: pytest -q tests/test_windowhub_resumable_task_host.py

      - name: Compile Windows/WindowHub runtime wiring and read-only smoke
        run: |
          python -m compileall -q \
            app/agent/perception/windowhub_ui_automation_provider.py \
            app/agent/perception/perception_engine.py \
            app/agent/perception/screen_element_fusion.py \
            app/agent/perception/target_resolver.py \
            app/agent/perception/windowhub_grid_reader.py \
            app/agent/bridge/world_state.py \
            app/agent/reasoning/task_planning_context.py \
            app/agent/reasoning/reasoning_task_planner.py \
            app/ai/analyze_pdf.py \
            app/agent/runtime/agent_runtime.py \
            app/agent/adapters/excel_workbook_adapter.py \
            app/agent/adapters/excel_annual_xy_aggregation.py \
            app/agent/runtime/windowhub_agent_runtime.py \
            app/agent/runtime/windowhub_resumable_task_host.py \
            app/agent/runtime/windows_desktop_agent_runtime.py \
            app/agent/runtime/windows_desktop_agent_control_loop.py \
            tools/run_windows_desktop_agent.py \
            tools/smoke_windows_desktop_navimind.py \
            app/agent/perception/windowhub_win32_form_provider.py \
            app/runtime/execution/vision/analyzers/canvas_analyzer.py \
            app/runtime/execution/vision/analyzers/hough_line_normalizer.py \
            tools/smoke_windowhub_readonly.py \
            tools/live_pdf_quote_draft_smoke.py \
            tools/diagnose_windowhub_field_scope.py \
            tools/diagnose_windowhub_semantics.py \
            tests/test_windowhub_agent_runtime.py \
            tests/test_windowhub_win32_form_provider.py \
            tests/test_hough_line_normalizer.py \
            tests/test_windowhub_field_scope_diagnostics.py \
            tests/test_diagnose_windowhub_semantics.py \
            tests/test_windows_desktop_agent_runtime.py
      - name: Run local-only Playwright provider smoke
        run: python tools/smoke_browser_provider_local.py
